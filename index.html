<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Case Management Workbench</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--n:#102A43;--dn:#0B1F3A;--b:#2563EB;--mb:#3B82F6;--lb:#DBEAFE;--pb:#EFF6FF;--bg:#F5F8FC;--w:#fff;--t:#172B4D;--s:#64748B;--bd:#D8E3F0;--m:#94A3B8;box-sizing:border-box}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);font:13px Inter,system-ui,Segoe UI,sans-serif;color:var(--t)}
#wrap{overflow-x:auto}#app{width:1440px;height:960px;display:flex;background:var(--bg);overflow:hidden}
nav{width:72px;background:var(--dn);display:flex;flex-direction:column;align-items:center;padding:10px 0;gap:4px;flex:none}
nav .i{width:60px;padding:8px 2px;text-align:center;font-size:10px;color:#9FB3C8;border-radius:8px;cursor:pointer}nav .i b{display:block;font-size:18px;font-weight:400}nav .i.a{background:var(--mb);color:#fff}
.logo{color:#fff;font-size:24px;margin-bottom:10px}.sp{flex:1}
#side{flex:1;display:flex;flex-direction:column;min-width:0}
header{height:64px;background:var(--w);border-bottom:1px solid var(--bd);display:flex;align-items:center;padding:0 24px;gap:20px;flex:none}
header .l{width:300px}header .l small{color:var(--s);font-size:11px;display:block}header .l b{font-size:15px;color:var(--n)}
header input{flex:1;max-width:380px;height:36px;border:1px solid var(--bd);border-radius:8px;padding:0 12px;background:var(--bg)}
.dt{margin-left:auto;font-size:11px;color:var(--s);font-weight:600;letter-spacing:.3px}
.av{width:34px;height:34px;border-radius:50%;background:var(--n);color:#fff;display:grid;place-items:center;font-size:12px;font-weight:600}
main{flex:1;padding:24px;overflow-y:auto}
h1{font-size:26px;margin:0;color:var(--n);font-weight:600}h2{font-size:16px;margin:0 0 3px;color:var(--n);font-weight:600}h3{font-size:12px;margin:0 0 6px;color:var(--n)}
.sub{color:var(--s);font-size:12px}.card{background:var(--w);border:1px solid var(--bd);border-radius:10px;padding:16px}
.row{display:flex;gap:16px}.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}.mt{margin-top:16px}
.btn{border:1px solid var(--b);background:var(--w);color:var(--b);border-radius:8px;padding:7px 12px;font:600 12px inherit;cursor:pointer}.btn.p{background:var(--b);color:#fff}.btn.s{padding:4px 9px;font-size:11px}
.chip{display:inline-block;border:1px solid var(--bd);border-radius:14px;padding:3px 10px;font-size:11px;margin:0 6px 6px 0;background:var(--w);color:var(--s)}.chip.a{background:var(--lb);color:var(--b);border-color:var(--mb)}
.st{display:inline-block;font-size:10px;font-weight:600;border-radius:5px;padding:2px 7px;border:1px solid var(--bd);white-space:nowrap}
.Verified{background:#fff;color:var(--b)}.Conflicting{background:var(--lb);color:var(--n)}.Missing{background:#fff;border:1px dashed var(--b);color:var(--b)}.Stale{background:var(--pb);color:var(--m)}.Unverified{background:#fff;border:1px dotted var(--b);color:var(--b)}.Inferred{background:var(--pb);color:var(--n)}.Critical{color:var(--n);border:2px solid var(--b);background:#fff}.Completed{background:var(--lb);color:var(--b)}
.big{font-size:26px;font-weight:700;color:var(--n)}.g4 .card:nth-child(1) .big{color:#2563EB}.g4 .card:nth-child(2) .big{color:#EA580C}.g4 .card:nth-child(3) .big{color:#059669}.g4 .card:nth-child(4) .big{color:#7C3AED}.q{display:grid;grid-template-columns:28px 1fr 100px 150px;gap:14px;align-items:start;padding:14px 0;border-top:1px solid var(--bd)}
.rk{width:26px;height:26px;border-radius:50%;background:var(--n);color:#fff;display:grid;place-items:center;font-weight:600}
a{color:var(--b);cursor:pointer;font-size:11px;text-decoration:underline}
.why{background:var(--pb);border:1px solid var(--bd);border-radius:8px;padding:10px;margin:8px 0;font-size:12px;display:none}.why.o{display:block}
table{width:100%;border-collapse:collapse;font-size:12px}th{text-align:left;color:var(--s);font-size:11px;padding:6px}td{padding:7px 6px;vertical-align:top;border-top:1px solid var(--bd)}tr:nth-child(even) td{background:var(--pb)}tr.k td{border-top:2px solid var(--b)}
.tl{border-left:2px solid var(--lb);margin-left:6px;padding-left:14px}.ev{margin-bottom:10px;position:relative}.ev:before{content:"";position:absolute;left:-20px;top:4px;width:10px;height:10px;border-radius:50%;background:var(--mb)}.ev.h{background:var(--pb);border-radius:6px;padding:6px}
.tabs{display:flex;gap:22px;border-bottom:1px solid var(--bd);margin:12px 0}.tabs span{padding:6px 0;color:var(--s)}.tabs .a{color:var(--n);font-weight:600;border-bottom:2px solid var(--b)}
.note{background:var(--pb);border-radius:6px;padding:8px;font-size:11px;color:var(--s);margin-top:8px}
.tile{border:1px solid var(--bd);border-radius:8px;padding:8px}.tile b{font-size:18px;color:var(--n)}
.bar{position:sticky;bottom:-24px;margin:16px -24px -24px;background:var(--w);border-top:1px solid var(--bd);padding:12px 24px;display:flex;gap:10px;justify-content:flex-end}
textarea{width:100%;height:70px;border:1px solid var(--bd);border-radius:8px;padding:8px;font:13px inherit;color:var(--t)}
.ac{border:1px solid var(--bd);border-radius:8px;padding:10px;margin-bottom:10px}
#toast{position:fixed;right:30px;top:76px;background:var(--n);color:#fff;padding:10px 16px;border-radius:8px;display:none}
</style></head><body><div id="wrap"><div id="app"></div></div><div id="toast"></div>
<script>
const P=[
{id:'P-02',mid:'M-20233',n:'Lakshmi Venkataraman',d:'79 · Female · MA-HMO',tag:'CRITICAL MEDICATION CONFLICT',h:'Warfarin and apixaban both have active supplies, with aspirin also found in the home.',f:[5,5,4,3],nx:'Same-day prescriber and pharmacist reconciliation. Contact daughter Priya with a Tamil interpreter.',due:'Today',sup:['Discharge Nov 2: warfarin stopped, apixaban 5 mg BID started','Home health saw both bottles plus aspirin 81 mg','Fall Oct 30, INR 4.1; INR visit still booked Nov 10']},
{id:'P-05',mid:'M-20562',n:'Andre L. Brooks',d:'54 · Male · MA D-SNP',tag:'OUTREACH BLOCKED / SPLIT IDENTITY',h:'Five ED visits in 83 days, but claims show only two. Recent withdrawal seizure and no working phone.',f:[4,5,4,5],nx:'Do not call the dead number. Explore consent-compliant contact through Harbor Light Shelter and Corner Care Pharmacy. Confirm the alias and merge duplicate cases.',due:'Nov 12',sup:['Four failed calls, SMS undelivered, letter returned','Sertraline, naltrexone, lisinopril lapsed 38 days','Two duplicate open cases (CM-5101, CM-5102)']},
{id:'P-04',mid:'M-20458',n:'Tomas Delgado Ruiz',d:'68 · Male · MA-HMO',tag:'CRITICAL INFORMATION GAP',h:'Admitted Nov 5, but no diagnosis or discharge event has arrived. Contact details and clinical information are outdated.',f:[4,4,5,5],nx:'Call the hospital discharge planner first. Contact son Mateo in the evening after appropriate authorisation and verify the current address.',due:'Today',sup:['Last eGFR 24 collected Sep 15, 2025 (stale)','HRA Dec 2025: lives with wife; Oct 20 note: lives with son','Hospital status UNKNOWN — discharge event not received']},
{id:'P-01',mid:'M-20117',n:'Ronald J. Kowalski',d:'72 · Male · MA-PPO',tag:'POST-DISCHARGE / FRAGMENTED INFORMATION',h:'New ileostomy after out-of-state surgery. Creatinine rose from 1.0 to 1.8; hospital hold on lisinopril conflicts with active records.',f:[4,5,3,3],nx:'Call Ron and wife Carol in daytime, verify the medication instruction, arrange a BMP in Arizona by Wednesday and submit the ostomy-supply authorisation.',due:'Nov 11',sup:['Discharged Nov 6 with home health (start unconfirmed)','Operative note, full discharge summary, facility claim not received','DME authorisation not submitted']},
{id:'P-03',mid:'M-20341',n:'Denise A. Whitfield',d:'66 · Female · MA-PPO',tag:'UNSTRUCTURED INFO / ADHERENCE CONTRADICTION',h:'Pharmacy fills suggest 100% adherence, but Denise reported skipped doses. Recent ED visit resulted in a chemotherapy hold.',f:[4,4,4,3],nx:'Contact Denise after 4 PM, validate the oncology instructions and request a pause of the Nov 18 shipment after confirmation.',due:'Nov 18',sup:['RN note Nov 3: skipped evening doses ~5 days','ED Nov 4–5, grade 3 diarrhea; capecitabine on hold','Full-dose auto-shipment still scheduled Nov 18; OCR 78–85%']}];
const sc=f=>(.4*f[0]+.3*f[1]+.2*f[2]+.1*f[3]).toFixed(2);
const st=(t,l)=>`<span class="st ${t}">${{Verified:'✓',Conflicting:'⇄',Missing:'▯',Stale:'◷',Unverified:'?',Inferred:'◈ INFERRED ·',Critical:'⚠',Completed:'✔'}[t]} ${l||t}</span>`;
let cur='cc',sel=0,tst=0;
const NAV=[['Command Centre','▦','cc'],['Patients','☰','m'],['Tasks','☑','s'],['Documents','▤'],['Reports','◫']];
function shell(title,crumb,act,body){return `<nav><div class="logo">✚</div>${NAV.map(n=>`<div class="i ${n[2]===act?'a':''}" onclick="${n[2]?`go('${n[2]}')`:''}"><b>${n[1]}</b>${n[0]}</div>`).join('')}<div class="sp"></div><div class="i"><b>⚙</b>Settings</div><div class="i"><b>?</b>Help</div></nav>
<div id="side"><header><div class="l"><small>${crumb}</small><b>${title}</b></div><input placeholder="Search patients by name or member ID"><span class="dt">MONDAY, NOV 09, 2026 · 8:00 AM</span><span>🔔</span><span>?</span><div class="av">MT</div><div><b style="font-size:12px">Maria Thompson</b><div class="sub" style="font-size:11px">RN Case Manager</div></div></header><main>${body}</main></div>`}
function go(v,i){if(i!==undefined)sel=i;cur=v;render();}
function toast(t){const e=document.getElementById('toast');e.textContent=t;e.style.display='block';setTimeout(()=>e.style.display='none',2600)}
function why(i){document.getElementById('w'+i).classList.toggle('o')}
/* ---------- 1 COMMAND CENTRE ---------- */
function cc(){
const M=[['👥','48','Active cases','Current caseload'],['⚕','6','New discharge alerts','Received since Friday'],['📋','5','Synthetic patients in this view','Demonstration dataset — not the full caseload'],['▣','6–7','Systems per patient today','Current-state workflow baseline']];
const rows=P.map((p,i)=>{const s=sc(p.f);return `<div class="q"><div class="rk">${i+1}</div><div><b style="font-size:16px">${p.n}</b> <span class="sub">${p.d} · ${p.id} · ${p.mid}</span><div style="margin:5px 0">${st('Critical',p.tag)}</div><div style="font-size:13px">${p.h}</div><div class="sub" style="margin-top:4px">${p.sup.join(' · ')}</div><div class="note"><b>Next action:</b> ${p.nx}</div>
<div class="why" id="w${i}"><b>Priority Score = (0.4 × Severity) + (0.3 × Time-criticality) + (0.2 × Data-trust gap) + (0.1 × Reachability difficulty)</b><br>Weights: Severity 40% · Time-criticality 30% · Data-trust gap 20% · Reachability 10%<br>Ratings: ${p.f.join(' / ')} → (0.4 × ${p.f[0]}) + (0.3 × ${p.f[1]}) + (0.2 × ${p.f[2]}) + (0.1 × ${p.f[3]}) = <b>${s}</b><br><i>Scores use judgement-based ratings and editable assumptions. This is an operational triage aid, not a validated clinical risk score.</i> <a>View methodology</a></div></div>
<div style="text-align:center"><div class="big" style="color:${['#DC2626','#EA580C','#D97706','#2563EB','#059669'][i]}">${s}</div><div class="sub">/ 5.00</div><a onclick="why(${i})">Why this score?</a></div><div style="display:grid;gap:6px"><button class="btn p" onclick="go('m',${i})">Open patient</button><button class="btn" onclick="go('s',${i})">Start work</button></div></div>`}).join('');
const ins=[['MEDICATION SAFETY','Two anticoagulants detected in Lakshmi’s home.','Hospital discharge says warfarin STOP and apixaban START. Home-health records show both bottles in the pillbox.',['Hospital discharge','Pharmacy','Home health'],'Evidence confidence for insight I-201: 0.90','Review evidence',0],['ADMISSION STATUS','Tomas’s hospital status remains unknown.','Admission alert received, but no diagnosis or discharge event is available.',['ADT alert','Data quality log'],'','Investigate admission',2],['FOLLOW-UP DEADLINE','Andre’s 7-day post-ED follow-up window closes November 12.','An IOP intake is scheduled, but the member may not know about it and has no confirmed transport.',['ED social-work note','Appointments','Transport benefit'],'','Prepare follow-up',1]].map(c=>`<div class="ac"><span class="st Critical" style="border-width:1px">${c[0]}</span><h3 style="margin-top:6px;font-size:13px">${c[1]}</h3><div class="sub">${c[2]}</div><div style="margin:6px 0">${c[3].map(x=>`<span class="chip">${x}</span>`).join('')}</div>${c[4]?`<div class="sub">${c[4]}</div>`:''}<button class="btn s" style="margin-top:6px" onclick="go('m',${c[6]})">${c[5]}</button></div>`).join('');
const act=[['Lakshmi','Same-day medication reconciliation','Today',0],['Tomas','Establish current hospital status','Today',2],['Ronald','Arrange BMP and submit ostomy DME authorisation','By Nov 11',3],['Andre','Send ED documents to UM; progress pended residential authorisation','Decision Nov 12',1],['Denise','Prepare oncology follow-up and shipment-pause request','Before Nov 18',4]].map(a=>`<div style="display:flex;gap:8px;padding:7px 0;border-top:1px solid var(--bd);cursor:pointer" onclick="go('s',${P.findIndex(p=>p.n.startsWith(a[0]))})"><div style="flex:1"><b>${a[0]}</b> — ${a[1]}<div class="sub">${a[2]}</div></div>›</div>`).join('');
return shell('Command Centre','Workspace','cc',`<div class="row" style="align-items:flex-end;justify-content:space-between"><div><h1>Good morning, Maria.</h1><div class="sub" style="font-size:13px">Here is your case management overview for Monday, November 9.</div></div><div style="display:flex;gap:10px"><button class="btn p" onclick="toast('Opening new case form')">+ Add case</button><button class="btn" onclick="toast('Exporting filtered worklist')">Export worklist</button></div></div>
<div class="g4 mt">${M.map(m=>`<div class="card"><span style="color:var(--mb)">${m[0]}</span><div class="big">${m[1]}</div><b>${m[2]}</b><div class="sub">${m[3]}</div></div>`).join('')}</div>
<div class="row mt"><div class="card" style="flex:68"><div class="row" style="justify-content:space-between;align-items:center"><div><h2>Your priority worklist</h2><div class="sub">Patients ranked by operational urgency and outstanding care needs.</div></div><div style="display:flex;gap:8px"><input placeholder="Search patients" style="height:30px;border:1px solid var(--bd);border-radius:8px;padding:0 8px"><button class="btn s">Filter</button><button class="btn s">Priority — highest first ▾</button></div></div>
<div style="margin:10px 0 0"><span class="chip a">All patients</span><span class="chip">New discharge</span><span class="chip">Medication conflicts</span><span class="chip">Missing information</span><span class="chip">Outreach blocked</span></div>${rows}</div>
<div style="flex:32"><div class="card"><h2>Needs your attention</h2><div style="margin-top:10px">${ins}</div></div><div class="card mt"><h2>Today’s action list</h2>${act}</div></div></div>`)}
/* ---------- 2 MEMBER 360 ---------- */
function m360(){const p=P[sel];const L=sel===0;
const ev=[['Nov 12','PCP post-discharge appointment','Plan scheduling T-2102','Follow-up with Dr. M. Fernandes. Scheduled.'],['Nov 10','INR appointment','Metro Anticoagulation Clinic T-2101','Standing INR check remains booked despite medication switch. Scheduled — requires review.'],['Nov 4, 10:30 AM','Transition-of-care call','Plan Contact History K-2101','Daughter Priya said medications were okay. Call marked complete, reconciliation not performed.'],['Nov 4','Home-health medication review','Sample Home Health D-2102','Warfarin 3 mg, apixaban 5 mg and aspirin 81 mg observed in home. IMPORTANT EVIDENCE','h'],['Nov 2','Apixaban prescription filled','Retail pharmacy F-2102','Apixaban 5 mg, 30-day supply, 60 tablets.'],['Nov 2, 12:30 PM','Hospital discharge','St. Example Hospital A-2103, D-2101','Warfarin stopped. Apixaban 5 mg BID started. Metoprolol reduced to 25 mg daily.'],['Oct 30, 11:10 PM','Inpatient admission','St. Example Hospital A-2102','Observation converted to inpatient admission.'],['Oct 30, 5:05 PM','Emergency department arrival','St. Example Hospital A-2101','Presented after a fall with scalp laceration. INR 4.1']].map(e=>`<div class="ev ${e[4]||''}"><b>${e[1]}</b> <span class="sub">${e[0]} · ${e[2]}</span><div>${e[3]}</div></div>`).join('');
const med=[['Hospital discharge summary','Nov 2','Apixaban 5 mg BID START; warfarin STOP','Hospital discharge instruction','Most recent prescriber intent in available sources',1],['PCP medication list','Aug 14','Warfarin 3 mg daily','Active in PCP record','Older record; predates hospital change'],['Cardiology note','Jun 18','Warfarin; INR target 2–3','Historical specialist record','May not reflect November change'],['Pharmacy fills','Oct 28, Nov 2','Warfarin 3 mg (90-day); apixaban 5 mg (30-day)','Both have active supply','Both available to patient; warfarin auto-refill still active',1],['Home-health RN','Nov 4','Warfarin 3 mg, apixaban 5 mg, aspirin 81 mg in home','Direct home observation','Strongest evidence of what is physically present',1],['Daughter’s report','Nov 4','Started the new heart pill','Caregiver report','Ambiguous; does not confirm old medication stopped'],['Anticoagulation clinic','Nov 10','INR check remains booked','Upcoming appointment','Downstream workflow still assumes warfarin']].map(r=>`<tr class="${r[5]?'k':''}"><td><b>${r[0]}</b></td><td>${r[1]}</td><td>${r[2]}</td><td>${r[3]}</td><td>${r[4]}</td></tr>`).join('');
const left=L?`<div class="card"><h2>Patient timeline</h2><div class="sub" style="margin-bottom:10px">Events from hospital, pharmacy, clinical records, care management and patient interactions.</div><div class="tl">${ev}</div><a>View all events</a></div>
<div class="card mt"><div class="row" style="justify-content:space-between"><div><h2>Medication reconciliation</h2><div class="sub">Conflicting medication information detected across seven sources.</div></div>${st('Critical','CONFLICT-CRITICAL')}</div><table style="margin-top:8px"><tr><th>Source</th><th>Date</th><th>Medication information</th><th>Source status</th><th>Evidence interpretation</th></tr>${med}</table>
<div class="note">Hospital discharge indicates a medication switch, while pharmacy and home-health records show both anticoagulants are available and present in the home. Human reconciliation is required.</div>
<div style="margin-top:10px;display:flex;gap:8px"><button class="btn">Compare source documents</button><button class="btn p" onclick="go('s',0)">Start reconciliation</button><button class="btn">Request pharmacist review</button></div>
<div class="sub" style="margin-top:10px">▸ Other medication discrepancy — Metoprolol: hospital 25 mg vs PCP, pharmacy, bottle 50 mg (HR 48) · <a>Review discrepancy</a><br>▸ Amlodipine 5 mg daily — sources agree · ▸ Aspirin 81 mg — home list only; flagged for pharmacist review</div></div>`
:`<div class="card"><h2>${p.tag}</h2><div style="font-size:14px;margin:6px 0">${p.h}</div><div class="sub" style="margin-bottom:8px">Key evidence for this issue, with source and collection date retained.</div>${p.sup.map(x=>`<div style="padding:7px 0;border-top:1px solid var(--bd)">${x}</div>`).join('')}<div style="margin-top:8px">${[['Missing','Information not received'],['Stale','Dated values'],['Unverified','Unconfirmed contact']].map(a=>st(a[0],a[1])).join(' ')}</div><div class="note">Full patient-specific evidence modules for this patient are outside this wireframe pass; the Lakshmi view shows the complete layout.</div></div>`;
const right=L?`<div class="card"><h2>Relevant clinical observations</h2><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px"><div class="tile">INR<br><b>4.1</b><div class="sub">Oct 30 · ED · goal 2–3 · prev 2.6 (Sep 22)</div></div><div class="tile">Creatinine<br><b>1.6 mg/dL</b><div class="sub">Oct 30 · ED · June 1.3</div></div><div class="tile">Weight<br><b>52 kg</b><div class="sub">Oct 30 · estimated triage; confirm</div></div><div class="tile">Heart rate<br><b>48 bpm</b><div class="sub">Nov 1 · hospital</div></div></div><div class="note">Weight and creatinine are inputs for prescriber verification of apixaban dosing criteria. Do not automatically recommend or change a dose.</div></div>
<div class="card mt"><h2>Evidence quality</h2><div style="display:grid;gap:6px;margin-top:8px">${[['Hospital discharge summary · Nov 2',st('Verified','Verified source')],['Home-health list · Nov 4',st('Verified','Direct observation')],['PCP list · Aug 14',st('Stale')],['Cardiology note · Jun 18',st('Stale','Historical')]].map(r=>`<div style="display:flex;justify-content:space-between">${r[0]}${r[1]}</div>`).join('')}</div></div>
<div class="card mt" style="border-color:var(--b)"><span class="sub">AI detected · Insight I-201 · Evidence confidence 0.90</span><h2>Potential medication safety issue</h2><div>Probable concurrent warfarin and apixaban exposure, with aspirin also present, following a fall with INR 4.1.</div><div class="note"><b>AI can do:</b> detect duplicate exposure; connect seven sources; rank severity; prepare prescriber summary.<br><b>Maria / clinical team must do:</b> verify bottles with caregiver; ask about bleeding and falls; arrange same-day prescriber/pharmacist review; confirm intended medication and dose.</div><button class="btn s" style="margin-top:8px">Review supporting evidence</button></div>`
:`<div class="card"><span class="sub">AI detected · Evidence confidence shown per insight</span><h2>Insight for ${p.n}</h2><div>${p.h}</div>${sel===2?`<div style="margin-top:8px">${st('Inferred','Possible dialysis-dependent kidney failure — NOT CONFIRMED')}<div class="sub">I-401 · confidence 0.55</div></div>`:''}</div>`;
const nxt=`<div class="card mt"><h2>Recommended next steps</h2><ol style="padding-left:18px;line-height:1.6;margin:6px 0">${L?'<li>Contact daughter Priya; ask her to read every bottle aloud (Tamil interpreter)</li><li>Ask about bruising, bleeding and further falls</li><li>Arrange same-day prescriber and pharmacist review</li><li>After confirmation, review warfarin auto-shipment and Nov 10 INR visit</li><li>Review metoprolol discrepancy</li><li>Pull PCP follow-up forward if appropriate</li>':`<li>${p.nx}</li>`}</ol><div class="note">Suggestions are prepared from available evidence. Maria retains final decision authority.</div><div style="display:flex;gap:8px;margin-top:10px"><button class="btn p" onclick="go('s',${sel})">Continue to Action Studio</button><button class="btn">Add investigation note</button></div></div>`;
const s=sc(p.f);
